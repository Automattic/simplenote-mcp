name: Bug Report
description: Report a reproducible problem with Simplenote MCP.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include Simplenote tokens, note contents, note IDs, private tags, or other personal note data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command, MCP client action, or tool call that triggers the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Simplenote macOS app (local Core Data store)
        - Simperium API
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.2, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Desktop, Cursor, VS Code, Zed, Cline, Windsurf"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, account details, and private note data before posting.
      render: shell
