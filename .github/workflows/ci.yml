name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (engines: >=22) and the development version (.nvmrc).
        node-version: ['22', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - run: npm audit signatures

      - run: npm run typecheck

      - run: npm test

  # Branch protection requires a check named `test`; this job reports the
  # combined result of the matrix so the required check name stays stable.
  test:
    if: always()
    needs: node
    runs-on: ubuntu-latest
    steps:
      - if: needs.node.result != 'success'
        run: |
          echo "Matrix result: ${{ needs.node.result }}"
          exit 1
      - run: echo "All Node versions passed."
